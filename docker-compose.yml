# Fozzie, run from the published release images (ADR-0172 decision 8).
# Standalone: no base file, no build step, nothing to clone. install.sh
# downloads this file to ~/fozzie/ (or ~/fozzie-<name>/ for a named
# instance) next to a generated .env, and always passes the Compose
# project name with `-p` -- so there's no `name:` here, and the same file
# can run more than one independently-named, independently-ported
# instance side by side.
#
# The image refs come from the release's latest.env, pinned by digest,
# and install.sh writes them into .env, with COMPOSE_PROJECT and
# FOZZIE_INSTALL_DIR for the updater. Re-running install.sh updates
# everything; the updater service below does a one-click update of
# core-api, dashboard and backup in place. Every port binds to the host's
# own loopback interface only, except the dashboard's opt-in (the
# installer's --public-host / --bind-address, ADR-0277) and the caddy
# service's 80 and 443 under the installer's --domain (ADR-0277's
# 2026-11-19 amendment). core-api's port never is, and the release
# registry (the installer's --registry-domain, ADR-0325) publishes none:
# only Caddy reaches it, over the Compose network.
#
# The orchestrator, which runs the agents created in the app (ADR-0215),
# is in the "agents" profile. install.sh turns it on by default by
# writing COMPOSE_PROFILES=agents into .env, which Compose reads from
# --env-file like any other value; `--no-agents` drops that line (and
# remembers the choice), so the orchestrator isn't started. The caddy
# service, which serves HTTPS for `--domain`, is likewise in the "domain"
# profile: install.sh adds it to COMPOSE_PROFILES (agents,domain) only
# with a domain. The release registry is in the "registry" profile,
# which install.sh adds after "domain" only with --registry-domain
# (agents,domain,registry). Every other service runs either way.
#
# The volume keys match the source-built local install's (ADR-0143), so
# an instance installed that way can switch to these images and keep its
# data: under the same `-p` project name the volumes resolve to the same
# Docker volumes (<project>_fozzie_pg_local_data and so on).
#
# Nothing here needs a Compose newer than 2.20.0.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fozzie
      POSTGRES_DB: fozzie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run install.sh -- it sets POSTGRES_PASSWORD in .env}
    # No host port: only core-api and backup talk to it, over the
    # Compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fozzie -d fozzie"]
      interval: 2s
      timeout: 3s
      retries: 10
    volumes:
      - fozzie_pg_local_data:/var/lib/postgresql/data
    restart: unless-stopped

  # The image's own CMD runs the migrations and then starts the server,
  # so there's no `command:` here.
  core-api:
    image: ${FOZZIE_CORE_API_IMAGE:?Run install.sh -- it sets FOZZIE_CORE_API_IMAGE in .env}
    environment:
      DATABASE_URL: postgres://fozzie:${POSTGRES_PASSWORD:?Run install.sh -- it sets POSTGRES_PASSWORD in .env}@postgres:5432/fozzie?connection_limit=10
      PORT: 4000
      GIT_REPO_ROOT: /data/git-repos
      ATTACHMENT_ROOT: /data/attachments
      # Decrypts the secrets Fozzie stores. Generated once by install.sh
      # and kept: losing it makes those secrets unreadable.
      FOZZIE_ENCRYPTION_KEY: ${FOZZIE_ENCRYPTION_KEY:?Run install.sh -- it sets FOZZIE_ENCRYPTION_KEY in .env}
      # Optional SMTP relay for invite emails. Unset means invite links
      # are shown once in the UI instead. Add these to .env yourself;
      # install.sh keeps any line it doesn't manage.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Invite and reset emails, the git help link, supervisor links and
      # federation callbacks all use these URLs. The installer writes them
      # (ADR-0277); with a public host both are the dashboard's address,
      # because the dashboard proxies core-api's browser and federation
      # routes. The fallbacks keep an older .env rendering as before.
      DASHBOARD_URL: ${FOZZIE_DASHBOARD_URL:-http://localhost:${DASHBOARD_PORT:-5173}}
      FOZZIE_PUBLIC_URL: ${FOZZIE_CORE_PUBLIC_URL:-http://localhost:${CORE_API_PORT:-4000}}
      FOZZIE_FEDERATION_SYNC_INTERVAL_MS: ${FOZZIE_FEDERATION_SYNC_INTERVAL_MS:-60000}
      FOZZIE_ARCHIVE_SWEEP_INTERVAL_MS: ${FOZZIE_ARCHIVE_SWEEP_INTERVAL_MS:-}
      FOZZIE_BRANCH_SWEEP_INTERVAL_MS: ${FOZZIE_BRANCH_SWEEP_INTERVAL_MS:-}
      FOZZIE_REPORT_FORECAST_SNAPSHOT_INTERVAL_MS: ${FOZZIE_REPORT_FORECAST_SNAPSHOT_INTERVAL_MS:-}
      FOZZIE_AUTO_COMPLETE_INTERVAL_MS: ${FOZZIE_AUTO_COMPLETE_INTERVAL_MS:-}
      FOZZIE_MERGE_TEST_GATE: ${FOZZIE_MERGE_TEST_GATE:-warn}
      FOZZIE_UI_TEST_GATE: ${FOZZIE_UI_TEST_GATE:-warn}
      FOZZIE_DEPLOY_ENVIRONMENT_ID: ${FOZZIE_DEPLOY_ENVIRONMENT_ID:-}
      SUPERVISOR_ESCALATION_ASSIGNEE: ${SUPERVISOR_ESCALATION_ASSIGNEE:-}
      FOZZIE_UI_RUNNER_PARTICIPANT_ID: ${FOZZIE_UI_RUNNER_PARTICIPANT_ID:-}
      # No FOZZIE_VERSION here: the image's own baked-in version is what
      # instanceVersion reports, so the updater's health check verifies
      # the image that's actually running, not .env's say-so.
      # Where Fozzie checks for a newer release (ADR-0172). Only this
      # file sets it, so only an instance run from the release images
      # ever checks.
      FOZZIE_RELEASE_MANIFEST_URL: https://functionberry.github.io/fozzie-releases/manifest.json
      # Shared with the updater, so only it can report update progress
      # (ADR-0172). Generated once by install.sh.
      FOZZIE_UPDATER_TOKEN: ${FOZZIE_UPDATER_TOKEN:-}
      # Minutes an update waits for running agents (live work leases) to
      # finish before proceeding anyway (ADR-0172). 0 means no wait; an
      # install with no agents running doesn't wait at all.
      FOZZIE_UPDATE_DRAIN_MINUTES: ${FOZZIE_UPDATE_DRAIN_MINUTES:-30}
      # Limits for importing a repository from a URL (ADR-0203). Empty
      # means the defaults: 500 MB, 600 seconds, 2 imports at once, and
      # private network addresses refused (set the last to true to allow
      # a git server on your LAN).
      FOZZIE_REPO_IMPORT_MAX_MB: ${FOZZIE_REPO_IMPORT_MAX_MB:-}
      FOZZIE_REPO_IMPORT_TIMEOUT_SECONDS: ${FOZZIE_REPO_IMPORT_TIMEOUT_SECONDS:-}
      FOZZIE_REPO_IMPORT_MAX_CONCURRENT: ${FOZZIE_REPO_IMPORT_MAX_CONCURRENT:-}
      FOZZIE_REPO_IMPORT_ALLOW_PRIVATE_NETWORKS: ${FOZZIE_REPO_IMPORT_ALLOW_PRIVATE_NETWORKS:-}
      # Sign-in limits (ADR-0280): failed logins per client IP and per
      # email in each window, and "Forgot password?" requests per IP per
      # hour. Empty means the defaults: 50, 10, 15 minutes and 10.
      FOZZIE_LOGIN_FAILURES_PER_IP: ${FOZZIE_LOGIN_FAILURES_PER_IP:-}
      FOZZIE_LOGIN_FAILURES_PER_EMAIL: ${FOZZIE_LOGIN_FAILURES_PER_EMAIL:-}
      FOZZIE_LOGIN_RATE_WINDOW_MINUTES: ${FOZZIE_LOGIN_RATE_WINDOW_MINUTES:-}
      FOZZIE_PASSWORD_RESET_REQUESTS_PER_IP: ${FOZZIE_PASSWORD_RESET_REQUESTS_PER_IP:-}
      # Attachment upload limits (ADR-0138's storage-limits amendment):
      # uploads per person per hour, and the free-disk guard's floor (an
      # upload must leave at least this percent of the disk, and this
      # many MB, free). Empty means the defaults: 100, 10 and 2048.
      # Per-person quotas and the instance cap are admin settings.
      FOZZIE_ATTACHMENT_UPLOADS_PER_HOUR: ${FOZZIE_ATTACHMENT_UPLOADS_PER_HOUR:-}
      FOZZIE_ATTACHMENT_MIN_FREE_PERCENT: ${FOZZIE_ATTACHMENT_MIN_FREE_PERCENT:-}
      FOZZIE_ATTACHMENT_MIN_FREE_MB: ${FOZZIE_ATTACHMENT_MIN_FREE_MB:-}
      # Federation limits (ADR-0308, ADR-0321): the most items, characters
      # per name, UTF-8 bytes per content body, bytes per whole response
      # and dependencies a sync may carry, and each partner's sync burst
      # and refill per minute. Empty means the defaults: 5000 items, 500
      # characters, 262144 bytes (256 KiB), 8388608 bytes (8 MiB), 20000
      # dependencies, a burst of 10 and 2 a minute.
      FOZZIE_FEDERATION_MAX_SNAPSHOT_ITEMS: ${FOZZIE_FEDERATION_MAX_SNAPSHOT_ITEMS:-}
      FOZZIE_FEDERATION_MAX_NAME_LENGTH: ${FOZZIE_FEDERATION_MAX_NAME_LENGTH:-}
      FOZZIE_FEDERATION_MAX_CONTENT_BYTES: ${FOZZIE_FEDERATION_MAX_CONTENT_BYTES:-}
      FOZZIE_FEDERATION_MAX_SNAPSHOT_BYTES: ${FOZZIE_FEDERATION_MAX_SNAPSHOT_BYTES:-}
      FOZZIE_FEDERATION_MAX_SNAPSHOT_DEPENDENCIES: ${FOZZIE_FEDERATION_MAX_SNAPSHOT_DEPENDENCIES:-}
      FOZZIE_FEDERATION_SYNC_BURST: ${FOZZIE_FEDERATION_SYNC_BURST:-}
      FOZZIE_FEDERATION_SYNC_PER_MINUTE: ${FOZZIE_FEDERATION_SYNC_PER_MINUTE:-}
      # Rate-limit by the X-Forwarded-For entry the outermost trusted proxy
      # wrote (ADR-0280). Safe only here: core-api's port is bound to
      # loopback below, so a remote browser can only arrive through the
      # dashboard's proxy, which appends its own socket peer to the header
      # -- or, with the installer's --domain, through the caddy service
      # first, which appends one too, so there are 2 trusted hops.
      FOZZIE_TRUST_FORWARDED_FOR: "true"
      # How many trusted proxies each appended one X-Forwarded-For entry
      # (ADR-0280's 2026-11-19 amendment). Empty means 1 (the dashboard's
      # proxy alone); install.sh --domain sets 2 (Caddy, then the
      # dashboard's proxy).
      FOZZIE_TRUSTED_PROXY_HOPS: ${FOZZIE_TRUSTED_PROXY_HOPS:-}
      # The release registry's domain, with the installer's
      # --registry-domain (ADR-0325). When set, core runs the registry's
      # retention sweep: once a day it deletes releases older than the
      # newest few (and not the manifest's latest) from the registry,
      # whose daily garbage collect then frees their space.
      FOZZIE_REGISTRY_DOMAIN: ${FOZZIE_REGISTRY_DOMAIN:-}
      # How many plain X.Y.Z releases retention keeps per image (default
      # 5, at least 1). Edge and hand-pushed tags are never deleted.
      FOZZIE_REGISTRY_KEEP_RELEASES: ${FOZZIE_REGISTRY_KEEP_RELEASES:-}
      # How often retention runs, in ms (default 86400000, a day; 0 turns
      # it off).
      FOZZIE_REGISTRY_RETENTION_INTERVAL_MS: ${FOZZIE_REGISTRY_RETENTION_INTERVAL_MS:-}
      # Where core reaches the registry (default http://registry:5000,
      # over the Compose network). Only for tests and development.
      FOZZIE_RELEASE_REGISTRY_INTERNAL_URL: ${FOZZIE_RELEASE_REGISTRY_INTERNAL_URL:-}
      # Lets the orchestrator below post its heartbeat (ADR-0201), so the
      # app can show whether the agent service is running. install.sh
      # generates it once, agents on or off, and hands the same value to
      # the orchestrator. `:-`, not `:?`, so an older .env still loads
      # (the agent service just reports not configured) until the
      # installer is re-run.
      FOZZIE_ORCHESTRATOR_HEARTBEAT_SECRET: ${FOZZIE_ORCHESTRATOR_HEARTBEAT_SECRET:-}
      # Installer instances only (ADR-0204, ADR-0215): core-api writes each
      # agent's credentials file (<slug>.env) into this volume itself, and
      # the orchestrator discovers the agents that have one. It holds agent
      # tokens at rest (dir 0700, files 0600, owned by the agent image's
      # uid 1000). `docker volume rm fozzie-<name>_fozzie_agent_secrets_local`
      # wipes it and un-delivers every agent. The orchestrator's baked-in
      # dispatch file mounts this exact volume key read-only into each
      # agent container, so don't rename it.
      FOZZIE_AGENT_SECRETS_DIR: /data/agent-secrets
      # The instance's name (ADR-0207), so the guided agent setup can say
      # how to re-run the installer for it. install.sh writes it. core-api
      # validates it against the Compose project-name rule and ignores
      # anything else.
      FOZZIE_INSTANCE_NAME: ${FOZZIE_INSTANCE_NAME:-}
      # Which installer made this instance: the release one, as opposed to
      # ./install.sh from a checkout. The two turn agents on with different
      # commands, and this is how the app will tell which to show.
      FOZZIE_INSTALL_KIND: release
    depends_on:
      postgres:
        condition: service_healthy
    # Always loopback, even when the dashboard is opened to the network
    # (ADR-0277): only install.sh's health check and the host-side CLI and
    # agents use it -- the browser goes through the dashboard's proxy.
    ports:
      - "127.0.0.1:${CORE_API_PORT:-4000}:4000"
    extra_hosts:
      # core-api lists an AI resource's models, so it has to reach a model
      # server on this computer (e.g. Ollama) at host.docker.internal.
      # Docker Desktop on Mac and Windows provides this out of the box; the
      # explicit mapping here makes it work on plain Linux Docker too.
      - "host.docker.internal:host-gateway"
    volumes:
      - fozzie_git_repos_local:/data/git-repos
      - fozzie_attachments_local:/data/attachments
      - fozzie_agent_secrets_local:/data/agent-secrets
    restart: unless-stopped

  dashboard:
    image: ${FOZZIE_DASHBOARD_IMAGE:?Run install.sh -- it sets FOZZIE_DASHBOARD_IMAGE in .env}
    environment:
      # Empty by default: the dashboard then uses the relative /graphql and
      # its own server proxies /graphql, /attachments, /repo-files, /gates
      # and /git (never /internal) to core-api over the Compose network, at
      # FOZZIE_CORE_API_UPSTREAM (default http://core-api:4000). The browser
      # talks to the dashboard's origin only, whatever host name or IP it
      # used, so core-api's own host port is never needed by the browser
      # (ADR-0172 decision 3, amended 2026-11-14). Set GRAPHQL_URL in .env
      # only to point the browser at a core-api on another origin; it's
      # read at container start.
      GRAPHQL_URL: ${GRAPHQL_URL:-}
    depends_on:
      - core-api
    # Loopback unless opted in with the installer's --public-host or
    # --bind-address, which set FOZZIE_BIND_ADDRESS (ADR-0277).
    ports:
      - "${FOZZIE_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-5173}:5173"
    restart: unless-stopped

  # A backup of the database, git repos and attachments every
  # BACKUP_INTERVAL_SECONDS (default daily), keeping the newest
  # BACKUP_RETAIN_COUNT (default 14), in the fozzie_backups_local volume.
  # Same image as core-api. $$ escapes Compose's own interpolation, so
  # the container's shell reads BACKUP_INTERVAL_SECONDS from its own
  # environment below. The first backup waits until core-api is healthy
  # at this image's version (capped by BACKUP_WAIT_FOR_CORE_API_SECONDS,
  # default 900, then it backs up anyway), so pg_dump never holds locks
  # while core-api migrates on start after an update (ADR-0139). Take one
  # now -- this doesn't wait -- with
  #   docker compose ... run --rm backup node dist/backupCli.js run
  # and list them with `... node dist/backupCli.js list`.
  backup:
    image: ${FOZZIE_CORE_API_IMAGE:?Run install.sh -- it sets FOZZIE_CORE_API_IMAGE in .env}
    environment:
      DATABASE_URL: postgres://fozzie:${POSTGRES_PASSWORD:?Run install.sh -- it sets POSTGRES_PASSWORD in .env}@postgres:5432/fozzie
      FOZZIE_ENCRYPTION_KEY: ${FOZZIE_ENCRYPTION_KEY:?Run install.sh -- it sets FOZZIE_ENCRYPTION_KEY in .env}
      GIT_REPO_ROOT: /data/git-repos
      ATTACHMENT_ROOT: /data/attachments
      BACKUP_ROOT: /data/backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETAIN_COUNT: ${BACKUP_RETAIN_COUNT:-14}
      # Optional off-site copy to S3-compatible storage, after each local
      # backup (docs/DEPLOYMENT.md §6, ADR-0319). Blank BACKUP_S3_BUCKET = off.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_PASSPHRASE: ${BACKUP_S3_PASSPHRASE:-}
      BACKUP_S3_RETAIN_COUNT: ${BACKUP_S3_RETAIN_COUNT:-}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-}
    volumes:
      - fozzie_git_repos_local:/data/git-repos
      - fozzie_attachments_local:/data/attachments
      - fozzie_backups_local:/data/backups
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c 'node dist/backupCli.js wait-for-core-api; while true; do node dist/backupCli.js run; sleep "$$BACKUP_INTERVAL_SECONDS"; done'
    restart: unless-stopped

  # One-click updates (ADR-0172 decisions 10 and 11, docker/updater/
  # README.md). Polls core-api for an admin-requested update and performs
  # it -- back up, pull by digest, recreate, health check, roll back by
  # itself on failure -- through the Docker socket. No port, no model. It
  # only ever runs `docker compose -p $COMPOSE_PROJECT` against this file
  # and .env (the install directory is mounted at its host path for
  # that), and only on core-api, dashboard and backup: never postgres,
  # never itself, never a volume. It doesn't update itself -- re-running
  # install.sh does. The release keys (FOZZIE_VERSION, the image refs,
  # POSTGRES_PASSWORD) are deliberately not in its environment: compose
  # would let them override .env.
  updater:
    image: ${FOZZIE_UPDATER_IMAGE:?Run install.sh -- it sets FOZZIE_UPDATER_IMAGE in .env}
    environment:
      COMPOSE_PROJECT: ${COMPOSE_PROJECT:?Run install.sh -- it sets COMPOSE_PROJECT in .env}
      FOZZIE_INSTALL_DIR: ${FOZZIE_INSTALL_DIR:?Run install.sh -- it sets FOZZIE_INSTALL_DIR in .env}
      # Shared with core-api above.
      FOZZIE_UPDATER_TOKEN: ${FOZZIE_UPDATER_TOKEN:-}
      # The same manifest core-api checks; the updater re-reads it itself
      # and takes only image refs pinned by digest from it.
      FOZZIE_RELEASE_MANIFEST_URL: https://functionberry.github.io/fozzie-releases/manifest.json
      # To pull the new images: Docker Desktop's credential store isn't
      # readable from a container.
      GHCR_USERNAME: ${GHCR_USERNAME:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      # And to pull from registry.functionberry.com (ADR-0329): the
      # tester's Fozria email and API token, which the installer saves in
      # .env.
      FOZRIA_REGISTRY_USERNAME: ${FOZRIA_REGISTRY_USERNAME:-}
      FOZRIA_REGISTRY_TOKEN: ${FOZRIA_REGISTRY_TOKEN:-}
      CORE_API_URL: http://core-api:4000
      # Its own image, so it can tell when a release ships a newer one.
      FOZZIE_UPDATER_IMAGE: ${FOZZIE_UPDATER_IMAGE}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${FOZZIE_INSTALL_DIR:?Run install.sh -- it sets FOZZIE_INSTALL_DIR in .env}:${FOZZIE_INSTALL_DIR:?Run install.sh -- it sets FOZZIE_INSTALL_DIR in .env}
      - fozzie_updater_state:/state
    depends_on:
      - core-api
    restart: unless-stopped

  # The agent service (ADR-0033, ADR-0215): polls core-api for ready work
  # and runs each agent created in the app as its own container, through
  # the Docker socket, like the updater above. It holds no Fozzie
  # credential -- only the heartbeat secret, valid on the heartbeat and
  # agent-discovery routes alone (ADR-0201, ADR-0204) -- and has no port,
  # no secrets volume and no mount of the install directory. Each agent
  # container loads its own credentials from fozzie_agent_secrets_local.
  #
  # What it dispatches is baked into its image, since there's no checkout
  # here: /orchestrator/release-dispatch/docker/docker-compose.agents.yml
  # (docker/orchestrator/release-dispatch/ in the repo), image-only, with
  # no build and no host bind mount. install.sh pulls the agent image on
  # the host first: the orchestrator can't log in to ghcr.io.
  #
  # Only in the "agents" profile (COMPOSE_PROFILES=agents in .env).
  # The image has a placeholder default rather than `:?` because Compose
  # checks every service's interpolation, profiled out or not: with `:?`,
  # an install without agents (a release with no orchestrator image) would
  # fail every compose command, the updater's included -- and an empty
  # image fails too ("has neither an image nor a build context"). The
  # placeholder is never pulled or run: install.sh only turns the profile
  # on when .env has the real image.
  orchestrator:
    image: ${FOZZIE_ORCHESTRATOR_IMAGE:-fozzie-orchestrator-not-in-this-release}
    profiles: ["agents"]
    environment:
      CORE_GRAPHQL_URL: http://core-api:4000/graphql
      # Shared with core-api above (ADR-0201).
      FOZZIE_ORCHESTRATOR_HEARTBEAT_SECRET: ${FOZZIE_ORCHESTRATOR_HEARTBEAT_SECRET:?Run install.sh -- it sets FOZZIE_ORCHESTRATOR_HEARTBEAT_SECRET in .env}
      # loop.sh passes this as `-p` on dispatch, so agents join this
      # instance's network (and volumes) alongside core-api.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT:?Run install.sh -- it sets COMPOSE_PROJECT in .env}
      # Agents are created in the app and discovered from core-api
      # (ADR-0204); there are no hand-listed identities and no host env
      # files here.
      AGENT_DISCOVERY: "true"
      AGENT_IDENTITIES: ""
      AGENT_ENV_FILE: ""
      # The baked-in dispatch file (see above). loop.sh runs
      # `cd $REPO_MOUNT/docker` and passes each AGENT_COMPOSE_FILES as -f.
      REPO_MOUNT: /orchestrator/release-dispatch
      AGENT_COMPOSE_FILES: docker-compose.agents.yml
      # Not used by the orchestrator itself: the dispatch file
      # interpolates these when it runs an agent, so they have to be in
      # this environment.
      FOZZIE_AGENT_IMAGE: ${FOZZIE_AGENT_IMAGE:-}
      FOZZIE_API_RETRY_SECONDS: ${FOZZIE_API_RETRY_SECONDS:-300}
      FOZZIE_SETUP_TIMEOUT_MINUTES: ${FOZZIE_SETUP_TIMEOUT_MINUTES:-15}
      # No UI runner on tester installs, so Run UI tests is skipped as not
      # applicable and the UI gate doesn't apply (ADR-0240), and there's
      # no Playwright pre-pull either.
      UI_RUNNER_PARTICIPANT_ID: ""
      MAX_CONCURRENT_AGENTS: ${MAX_CONCURRENT_AGENTS:-1}
      POLL_INTERVAL_SECONDS: "20"
      # ADR-0148: pause an agent once its Claude subscription window
      # reaches this percentage, leaving headroom for interactive use.
      RATE_LIMIT_PAUSE_AT_FIVE_HOUR: "80"
      RATE_LIMIT_PAUSE_AT_WEEKLY: "85"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - core-api
    restart: unless-stopped

  # HTTPS at a domain name, for a server reachable from the internet (the
  # installer's --domain, ADR-0277's 2026-11-19 amendment): Caddy gets and
  # renews a Let's Encrypt certificate for FOZZIE_DOMAIN by itself,
  # redirects HTTP to HTTPS, and forwards everything to the dashboard over
  # the Compose network, passing the original Host header through. The
  # dashboard and core-api stay on loopback; only this service listens
  # publicly. With --registry-domain (ADR-0325) it also serves the release
  # registry's site, with its own certificate, forwarding to the registry
  # service below.
  #
  # It runs the Caddyfile install.sh writes beside this file
  # (install_caddyfile, ADR-0277's 2026-11-21 amendment): the domain, the
  # reverse proxy, and the standard security headers (HSTS, nosniff,
  # framing, referrer and permissions policies), each only where the app
  # hasn't set its own, with Server, Via and X-Powered-By removed.
  # Re-running install.sh rewrites it, so edits to it are overwritten. The
  # long syntax with create_host_path: false makes a missing file an
  # error, rather than Docker creating a root-owned directory there.
  #
  # Only in the "domain" profile (COMPOSE_PROFILES=...,domain in .env), and
  # install.sh only turns it on with a domain, so the domain lives in the
  # Caddyfile alone, not in an interpolation here.
  #
  # The certificates (and Caddy's account key) live in fozzie_caddy_data.
  # Keep it: Let's Encrypt rate-limits new certificates, and --no-domain
  # removes the container but not its volumes. The updater never touches
  # this service; re-running install.sh updates it.
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    profiles: ["domain"]
    # One line on purpose: scripts/test.sh checks it as written.
    # prettier-ignore
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - fozzie_caddy_data:/data
      - fozzie_caddy_config:/config
      - type: bind
        source: ${FOZZIE_INSTALL_DIR:?Run install.sh -- it sets FOZZIE_INSTALL_DIR in .env}/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - dashboard
    restart: unless-stopped

  # The release registry, with the installer's --registry-domain
  # (ADR-0325): a Docker registry for Fozria's own release images,
  # served at https://FOZZIE_REGISTRY_DOMAIN through Caddy's second site.
  # Every request needs a token from core-api's token service (ADR-0322),
  # at the app domain's /registry/token; nothing is served until an admin
  # enables the release registry in the app. It publishes no host port:
  # only Caddy reaches it, over the Compose network.
  #
  # Its entrypoint is the supervisor install.sh writes beside this file
  # (install_registry_supervisor), which runs `registry serve` as its
  # child. Registry 2.8 reads its token-signing certificate bundle only at
  # start, so the supervisor polls core-api's /registry/certs and
  # restarts the registry when the bundle changes -- without a sidecar
  # holding the Docker socket. It also switches the registry to read-only
  # (pulls work, pushes refused) when the disk runs low, with the same
  # margin as attachments, and stops it briefly once a day for a garbage
  # collect. registry-config.yml, also written by install.sh, is the
  # config it starts from; http.secret comes from .env instead.
  #
  # The images live in fozzie_registry_data, or with FOZZIE_REGISTRY_STORAGE
  # set to an absolute host path (a block volume, say) in a bind mount
  # there; the installer keeps that hand-set .env line as it is.
  # --no-registry removes the container and its files but keeps the
  # stored images. The updater never touches this service; re-running
  # install.sh updates it.
  registry:
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    profiles: ["registry"]
    # One line on purpose: scripts/test.sh checks it as written.
    # prettier-ignore
    entrypoint: ["/bin/sh", "/fozzie/registry-supervisor.sh"]
    environment:
      REGISTRY_HTTP_SECRET: ${FOZZIE_REGISTRY_HTTP_SECRET:-}
      FOZZIE_REGISTRY_CERT_POLL_SECONDS: ${FOZZIE_REGISTRY_CERT_POLL_SECONDS:-}
      FOZZIE_REGISTRY_GC_INTERVAL_SECONDS: ${FOZZIE_REGISTRY_GC_INTERVAL_SECONDS:-}
      FOZZIE_ATTACHMENT_MIN_FREE_PERCENT: ${FOZZIE_ATTACHMENT_MIN_FREE_PERCENT:-}
      FOZZIE_ATTACHMENT_MIN_FREE_MB: ${FOZZIE_ATTACHMENT_MIN_FREE_MB:-}
    volumes:
      - ${FOZZIE_REGISTRY_STORAGE:-fozzie_registry_data}:/var/lib/registry
      - type: bind
        source: ${FOZZIE_INSTALL_DIR:?Run install.sh -- it sets FOZZIE_INSTALL_DIR in .env}/registry-config.yml
        target: /fozzie/registry-config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${FOZZIE_INSTALL_DIR:?Run install.sh -- it sets FOZZIE_INSTALL_DIR in .env}/registry-supervisor.sh
        target: /fozzie/registry-supervisor.sh
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - core-api
    restart: unless-stopped

volumes:
  fozzie_pg_local_data:
  fozzie_git_repos_local:
  fozzie_attachments_local:
  fozzie_backups_local:
  # The updater's run.json and report queue, so a restart resumes a run.
  fozzie_updater_state:
  # Each agent's credentials (written by core-api). The key must stay
  # identical to the orchestrator image's dispatch file's (and
  # docker/docker-compose.local.yml's), so they resolve to the same
  # <project>_fozzie_agent_secrets_local volume. Agents' home volumes
  # (<project>_agent_home_<slug>, ADR-0310) are declared only by the
  # dispatch file, created on an agent's first run.
  fozzie_agent_secrets_local:
  # Caddy's certificates and its own config (the "domain" profile).
  fozzie_caddy_data:
  fozzie_caddy_config:
  # The release registry's images (the "registry" profile);
  # --no-registry keeps it.
  fozzie_registry_data:
